name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx schemathesis pytest-alembic

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          NEXTAUTH_SECRET: "ci-test-nextauth-secret-not-for-production"
          TESTING: "true"
          DEBUG: "true"
        run: pytest --ignore=tests/test_api_contract.py

      - name: Run Contract Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          NEXTAUTH_SECRET: "ci-test-nextauth-secret-not-for-production"
          TESTING: "true"
          DEBUG: "true"
        run: pytest tests/test_api_contract.py

  deploy:
    runs-on: ubuntu-latest
    needs: [quality-check]
    if: github.ref == 'refs/heads/main'
    container: ghcr.io/railwayapp/cli:latest
    env:
      # RAILWAY_TOKEN must be a project-scoped token (created in Railway Dashboard
      # > Project > Settings > Tokens), NOT an account/API token. The project token
      # encodes which project to deploy to; no RAILWAY_PROJECT_ID is needed alongside it.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Using the service UUID avoids case-sensitive name matching ("Service not found").
      # Get this from Railway Dashboard: Cmd/Ctrl+K > "Copy Service ID".
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to Railway
        run: railway up --service=$RAILWAY_SERVICE_ID
        working-directory: ./backend
