name: E2E Tests

on:
  deployment_status:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Use the official Playwright image so Chromium + all system deps are
    # pre-installed. This bypasses:
    #   - actions/cache incompatibility with deployment_status events (no Git ref)
    #   - npx playwright install post-extract hang (silently takes >15 min)
    #   - repeated 164 MiB binary downloads on every cold run
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    if: github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url || 'http://localhost:3000' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # Required: container home differs from runner home; Playwright
          # resolves browser paths relative to HOME.
          HOME: /root

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
