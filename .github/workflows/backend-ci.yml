name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths: [ "backend/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "backend/**" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      # Service container for Postgres to run integration tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff pinned: 0.16.0 changed its default rule selection and
          # started flagging ~986 pre-existing findings (DTZ001/DTZ003,
          # import sort, etc.) across files nobody had touched, breaking
          # every backend PR regardless of content. 0.15.22 is the version
          # backend-check last passed cleanly with (PR #122, 2026-07-17).
          pip install pytest pytest-cov "ruff==0.15.22" mypy httpx coverage email-validator

      - name: Lint with Ruff
        run: ruff check .

      - name: Type Check with Mypy
        run: mypy app --config-file mypy.ini
        continue-on-error: true  # Type errors tracked separately

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          NEXTAUTH_SECRET: test-nextauth-secret
          TESTING: "true"
          PYTHONPATH: ${{ github.workspace }}/backend
        continue-on-error: true  # Pre-existing test issues - tracked separately
        run: |
          pytest --cov=app --cov-report=xml --ignore=tests/test_api_contract.py --ignore=tests/load_test.py

      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage.xml
          flags: backend
