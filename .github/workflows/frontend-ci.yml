name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths: [ "frontend/**", ".github/workflows/**", "session-context.md", "project-context.md", "conversation-context.md", "session-summary.md" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "frontend/**", ".github/workflows/**", "session-context.md", "project-context.md", "conversation-context.md", "session-summary.md" ]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true  # Pre-existing lint issues - tracked separately

      - name: Type Check (TypeScript)
        # Assumes a script "type-check": "tsc --noEmit" in package.json or runs tsc directly
        run: npx tsc --noEmit
        continue-on-error: true  # Pre-existing type errors - tracked separately

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend-unit-tests
          name: frontend-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/test-report.junit.xml
          flags: frontend-unit-tests
          name: frontend-test-results
          verbose: true

      - name: Verify Build
        run: npm run build
        env:
          # Mock vars to allow build to pass without real keys
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-key
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
