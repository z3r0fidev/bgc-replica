[mypy]
python_version = 3.12
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = (?x)(
    alembic/
    | tests/
    | scripts/
  )

# Ignore import-untyped for third-party libraries without stubs
[mypy-jose.*]
ignore_missing_imports = true

[mypy-passlib.*]
ignore_missing_imports = true

[mypy-bleach.*]
ignore_missing_imports = true

[mypy-qrcode.*]
ignore_missing_imports = true

[mypy-socketio.*]
ignore_missing_imports = true

[mypy-celery.*]
ignore_missing_imports = true

[mypy-locust.*]
ignore_missing_imports = true

[mypy-faker.*]
ignore_missing_imports = true

[mypy-schemathesis.*]
ignore_missing_imports = true

[mypy-hypothesis.*]
ignore_missing_imports = true

[mypy-PIL.*]
ignore_missing_imports = true

# Allow implicit optional for now (legacy code)
no_implicit_optional = false

# SQLAlchemy and Pydantic have complex types
[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

# Ignore errors in specific problematic files
[mypy-app.models.*]
ignore_errors = true

[mypy-app.api.gallery]
ignore_errors = true

[mypy-app.api.group_chats]
ignore_errors = true

[mypy-app.core.pagination]
ignore_errors = true

[mypy-app.services.media_processor]
ignore_errors = true

[mypy-app.services.user_service]
ignore_errors = true

[mypy-app.services.recommendation_service]
ignore_errors = true

[mypy-app.services.moderation_service]
ignore_errors = true

[mypy-app.services.block_service]
ignore_errors = true

[mypy-app.services.totp_service]
ignore_errors = true

[mypy-app.services.storage]
ignore_errors = true
