[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
# test_api_contract.py's schemathesis-fuzzed requests bypass the db_session
# fixture's rollback-per-test isolation entirely (its TestClient never gets
# app.dependency_overrides[get_db] applied), so its real, committed writes
# (e.g. POST /api/moderation/report creating real ContentReport rows) persist
# for the rest of whatever pytest PROCESS it ran in - corrupting exact-count
# assertions in test_moderation_api.py and, via a related connection-pool/
# event-loop interaction, test_main.py::test_health, for any other test that
# happens to run afterward in that same process. Real CI is unaffected: every
# workflow that runs contract tests does so as its own separate `pytest`
# invocation/step, so this exclusion just makes bare local `pytest` match
# that same safe behavior by default. Run contract tests on their own with
# `pytest tests/test_api_contract.py` (this ignore doesn't block an
# explicitly-named target, only default collection).
addopts = --ignore=tests/test_api_contract.py
python_files = test_*.py
pythonpath = .
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore:.*on_event.*deprecated.*:DeprecationWarning
    ignore:.*on_event.*:DeprecationWarning:fastapi.*
    ignore:coroutine 'Connection._cancel' was never awaited
